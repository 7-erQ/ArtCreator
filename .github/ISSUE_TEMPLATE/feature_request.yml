name: 功能建议
description: 提出具体使用场景或改进建议
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 描述实际使用场景及当前遇到的限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的效果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方式
